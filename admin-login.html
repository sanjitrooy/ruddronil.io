<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Ruddranil.io — Admin Sign In</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('ruddranil_theme') || 'dark');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-dark); min-height: 100vh; display: flex; flex-direction: column;">
  <header class="navbar" style="border-bottom: 1px solid rgba(239, 68, 68, 0.25);">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">Ruddranil<span class="dot">.io</span></a>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="btn-theme-toggle" aria-label="Toggle light or dark theme" type="button">
          <span class="theme-icon-indicator" aria-hidden="true">🌙</span><span class="theme-text-label">Dark</span>
        </button>
        <a href="index.html" class="btn btn-secondary btn-sm">← Public Site</a>
      </div>
    </div>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <section class="card" style="max-width: 440px; width: 100%; padding: 36px 28px; border-color: rgba(239, 68, 68, 0.35); border-radius: 16px;">
      <div style="text-align: center; margin-bottom: 22px;">
        <span class="section-kicker" style="color: #f87171;">RESTRICTED ADMIN ACCESS</span>
        <h1 style="font-size: 22px; font-weight: 800; color: #fff; margin: 8px 0;">Admin Sign In</h1>
        <p style="font-size: 13px; color: var(--text-gray);">Sign in with an administrator account. Admin access must be assigned by the trusted Supabase project administrator.</p>
      </div>
      <div id="adminAuthAlert" class="auth-alert-box" style="display: none; margin-bottom: 18px;" role="alert" aria-live="polite"></div>
      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="adminIdentifier">Admin email</label>
          <input type="email" id="adminIdentifier" class="form-input" placeholder="admin@example.com" required autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <input type="password" id="adminPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" id="btnAdminSubmit" class="btn btn-primary btn-block btn-lg" style="background: linear-gradient(135deg, #ef4444, #dc2626); border-color: #ef4444; justify-content: center;">
          <span id="adminBtnLabel">Sign in securely</span>
        </button>
      </form>
      <p style="margin-top: 20px; font-size: 11.5px; color: var(--text-dark-gray); text-align: center;">No demo credentials or quick-unlock option is available.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('adminAuthAlert');
    const submitButton = document.getElementById('btnAdminSubmit');
    const buttonLabel = document.getElementById('adminBtnLabel');

    function showAdminError(message) {
      alertBox.textContent = message;
      alertBox.className = 'auth-alert-box auth-alert-error';
      alertBox.style.display = 'block';
    }

    function hasTrustedAdminClaim(user) {
      const claims = user && user.app_metadata;
      return Boolean(claims && (claims.role === 'admin' || claims.is_admin === true || claims.is_admin === 'true'));
    }

    function completeAdminSignIn(user) {
      // This marker is only a UI convenience for the legacy admin page; it is NOT server authorization.
      sessionStorage.setItem('ruddranil_admin_unlocked', 'true');
      const displayUser = {
        id: user.id,
        name: user.user_metadata?.full_name || 'Administrator',
        email: user.email || '',
        role: 'admin'
      };
      localStorage.setItem('currentUser', JSON.stringify(displayUser));
      window.location.replace('admin.html');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      alertBox.style.display = 'none';
      const email = document.getElementById('adminIdentifier').value.trim().toLowerCase();
      const passwordInput = document.getElementById('adminPassword');
      const password = passwordInput.value;
      if (!email || !password) {
        showAdminError('Enter your administrator email and password.');
        return;
      }
      if (!window.sbClient?.auth) {
        showAdminError('Authentication service is unavailable. Please try again later.');
        return;
      }

      submitButton.disabled = true;
      buttonLabel.textContent = 'Verifying administrator…';
      try {
        const { data, error } = await window.sbClient.auth.signInWithPassword({ email, password });
        passwordInput.value = '';
        if (error || !data?.user) {
          showAdminError('Sign-in failed. Check your credentials and try again.');
          return;
        }
        if (!hasTrustedAdminClaim(data.user)) {
          await window.sbClient.auth.signOut();
          showAdminError('This account is not authorized for the admin console.');
          return;
        }
        completeAdminSignIn(data.user);
      } catch (_) {
        passwordInput.value = '';
        showAdminError('Unable to verify your account. Please try again.');
      } finally {
        submitButton.disabled = false;
        buttonLabel.textContent = 'Sign in securely';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('themeToggleBtn');
      if (toggle) toggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('ruddranil_theme', next); } catch (_) {}
        toggle.querySelector('.theme-text-label').textContent = next === 'dark' ? 'Dark' : 'Light';
        toggle.querySelector('.theme-icon-indicator').textContent = next === 'dark' ? '🌙' : '☀️';
      });

      // Only accept an existing session if Supabase's trusted app_metadata confirms admin access.
      window.sbClient?.auth?.getSession().then(({ data }) => {
        const user = data?.session?.user;
        if (user && hasTrustedAdminClaim(user)) completeAdminSignIn(user);
      }).catch(() => {});
    });
  </script>
</body>
</html>
